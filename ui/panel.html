<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>MATFORGE</title>
<style>
  :root{
    --bay:#171717; --panel:#1e1e1e; --raise:#262626; --sunk:#141414;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --text:#e7e7e7; --dim:#9b9b9b; --faint:#6a6a6a;
    --signal:#57e39a; --signal-dim:rgba(87,227,160,.16); --alert:#f0a54a; --err:#ff7b72;
    --mono:"JetBrains Mono",Consolas,Menlo,monospace;
    --ui:"Segoe UI",system-ui,sans-serif; --r:2px;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bay);color:var(--text);font:400 13px/1.55 var(--ui)}
  .bar{height:46px;background:var(--panel);border-bottom:1px solid var(--line);
       display:flex;align-items:center;padding:0 14px;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;font:700 12px/1 var(--mono);letter-spacing:.2em}
  .glyph{width:12px;height:12px;border:1.5px solid var(--signal);border-radius:50%;position:relative}
  .glyph:after{content:"";position:absolute;left:3px;top:3px;right:3px;bottom:3px;border-radius:50%;background:var(--signal);
    -webkit-animation:pulse 2.4s infinite;animation:pulse 2.4s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .tabs{margin-left:auto;display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:2px}
  .tabs button{background:transparent;color:var(--faint);border:0;border-radius:var(--r);
    padding:5px 11px;font:600 9.5px var(--mono);letter-spacing:.12em;cursor:pointer}
  .tabs button.on{background:var(--raise);color:var(--text)}
  .body{padding:18px 16px}
  .view{display:none} .view.on{display:block;-webkit-animation:fade .18s;animation:fade .18s}
  @keyframes fade{from{opacity:0}}

  .field{margin-bottom:14px}
  label.k{display:block;font:600 9px var(--mono);letter-spacing:.16em;color:var(--faint);
    text-transform:uppercase;margin-bottom:6px}
  input[type=text],input[type=password],select,textarea{width:100%;background:var(--sunk);color:var(--text);
    border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font:400 13px var(--ui);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--line2)}
  .row{display:flex;gap:8px} .row>input{flex:1}
  .btn{background:var(--raise);color:var(--dim);border:1px solid var(--line);border-radius:var(--r);
    padding:0 13px;font:600 10px var(--mono);letter-spacing:.1em;cursor:pointer}
  .btn:hover{color:var(--text);border-color:var(--line2)}
  .seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px}
  .seg button{flex:1;background:transparent;color:var(--dim);border:0;border-radius:var(--r);
    padding:7px 4px;font:600 11px var(--mono);letter-spacing:.05em;cursor:pointer}
  .seg button.on{background:var(--raise);color:var(--text)}
  .seg .hint{display:block;font:500 8px var(--mono);color:var(--faint);letter-spacing:.08em;margin-top:3px}
  .seg button.on .hint{color:var(--dim)}
  .toggle{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--dim);font-size:12px}
  .toggle .sw{width:34px;height:19px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;position:relative;flex:none}
  .toggle .sw:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--faint)}
  .toggle.on .sw{background:var(--signal-dim);border-color:var(--signal)}
  .toggle.on .sw:after{left:16px;background:var(--signal)}
  .toggle.on{color:var(--text)}
  .go{width:100%;margin-top:4px;padding:12px;border:0;border-radius:var(--r);background:var(--signal);
    color:#0c1a12;font:700 11px var(--mono);letter-spacing:.14em;cursor:pointer}
  .go:disabled{background:var(--raise);color:var(--faint)}
  .status{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.busy{background:var(--alert)} .dot.ok{background:var(--signal)} .dot.err{background:var(--err)}
  .stxt{font:500 11px var(--mono);color:var(--dim)}
  .note{font:400 11px var(--ui);color:var(--faint);margin:2px 0 14px;line-height:1.5}
  .feed{height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);
    background:var(--sunk);padding:11px;margin-bottom:10px}
  .msg{margin-bottom:11px}
  .msg .who{font:600 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
  .msg.u .who{color:var(--faint)} .msg.a .who{color:var(--signal)}
  .msg .txt{font:400 12.5px/1.5 var(--ui);color:var(--text);white-space:pre-wrap}
  .msg.a .txt{color:var(--dim)}
</style>
</head>
<body>
  <div class="bar">
    <div class="brand"><div class="glyph"></div>MATFORGE</div>
    <div class="tabs">
      <button id="tCreate" class="on">CREATE</button>
      <button id="tSettings">SETTINGS</button>
      <button id="tChat">HELP</button>
    </div>
  </div>
  <div class="body">

    <div class="view on" id="vCreate">
      <div class="field"><label class="k">Reference image</label>
        <div class="row"><input type="text" id="img" placeholder="pick a reference photo..." readonly>
        <button class="btn" id="browse">BROWSE</button></div></div>
      <div class="field"><label class="k">Material name</label>
        <input type="text" id="name" placeholder="e.g. Oak_Floor"></div>
      <div class="field"><label class="k">Material type</label><select id="cls"></select></div>
      <div class="field"><label class="k">Engine</label>
        <div class="seg" id="eng"><button data-v="fast" class="on">FAST<span class="hint">OFFLINE</span></button>
        <button data-v="ultra">ULTRA<span class="hint">PATINA AI + FABLE-5</span></button></div></div>
      <div class="field"><div class="toggle" id="assign"><div class="sw"></div>Assign to selected objects</div></div>
      <div class="field"><div class="toggle" id="slate"><div class="sw"></div>Open in Slate ME (show node wiring)</div></div>
      <div class="field"><label class="k">Resolution <span class="hint">final output</span></label>
        <div class="seg" id="res"><button data-v="2k">2K<span class="hint">2048</span></button>
        <button data-v="4k" class="on">4K<span class="hint">4096</span></button>
        <button data-v="8k">8K<span class="hint">8192</span></button></div></div>
      <button class="go" id="go">CREATE MATERIAL &rarr; SPHERE</button>
      <div class="status"><div class="dot" id="dot"></div><div class="stxt" id="stxt">Ready.</div></div>
    </div>

    <div class="view" id="vSettings">
      <div class="note">Keys are stored locally in <b>_keys.json</b> and override the built-in
        fallback. Leave a field blank to keep its current value.</div>
      <div class="field"><label class="k">fal.ai API key</label>
        <input type="password" id="falKey" placeholder="unchanged"></div>
      <div class="field"><label class="k">omega key (Fable-5)</label>
        <input type="password" id="omKey" placeholder="unchanged"></div>
      <div class="field"><label class="k">omega model</label>
        <input type="text" id="omModel" placeholder="claude-fable-5"></div>
      <button class="go" id="saveKeys">SAVE KEYS</button>
      <div class="status"><div class="dot" id="sdot"></div><div class="stxt" id="sstxt">&mdash;</div></div>
    </div>

    <div class="view" id="vChat">
      <div class="note">Stuck? Ask Fable-5 about MatForge, V-Ray materials, or the workflow.</div>
      <div class="feed" id="feed"></div>
      <div class="row"><input type="text" id="q" placeholder="ask a question...">
        <button class="btn" id="send">SEND</button></div>
    </div>

  </div>

<script>
(function(){
  var CLASSES=[["wood_interior","Wood - interior / lacquered"],["wood_exterior","Wood - exterior / weathered"],
    ["concrete","Concrete / plaster"],["stone","Stone / paver / brick"],["marble","Marble / polished stone"],
    ["metal_brushed","Metal - brushed / raw"],["metal_painted","Metal - painted / powder-coated"],
    ["glass_clear","Glass - clear / glazing"],["fabric","Fabric / linen / upholstery"],["leather","Leather"],
    ["paint_wall","Painted wall"],["foliage","Foliage / leaves"],
    ["granite","Granite / terrazzo (polished)"],["concrete_polished","Concrete - polished / microcement"],
    ["terracotta","Terracotta / clay / unglazed brick"],["ceramic_glazed","Ceramic / porcelain (glazed tile)"],
    ["glass_frosted","Glass - frosted / etched"],["gemstone","Gemstone / crystal"],["water","Water / liquid"],
    ["metal_chrome","Metal - chrome / mirror polished"],["metal_satin","Metal - satin / stainless steel"],
    ["metal_rust","Metal - rusted / corten steel"],["car_paint","Car paint (metallic + clearcoat)"],
    ["plastic_glossy","Plastic - glossy"],["plastic_matte","Plastic - matte"],["rubber","Rubber"],
    ["velvet","Velvet"],["carpet","Carpet / rug"],["paper","Paper / cardboard"],["cork","Cork"],
    ["asphalt","Asphalt / tarmac"],["sand","Sand / gravel / soil"],["wax","Wax / candle / soap (SSS)"],
    ["emissive","Emissive / LED panel"],["generic","Generic dielectric"]];
  var sel=document.getElementById("cls"),i,o;
  for(i=0;i<CLASSES.length;i++){o=document.createElement("option");o.value=CLASSES[i][0];o.text=CLASSES[i][1];sel.appendChild(o);}

  function byId(id){return document.getElementById(id);}
  function on(el,ev,fn){if(el.addEventListener){el.addEventListener(ev,fn,false);}else{el.attachEvent("on"+ev,fn);}}
  function txt(el,s){el.textContent=(s==null?"":String(s));}

  function show(v){var ids=["Create","Settings","Chat"],k;for(k=0;k<ids.length;k++){
    byId("v"+ids[k]).className="view"+(ids[k]===v?" on":"");
    byId("t"+ids[k]).className=(ids[k]===v?"on":"");}
    if(v==="Settings"){cmd("getkeys");} }
  on(byId("tCreate"),"click",function(){show("Create");});
  on(byId("tSettings"),"click",function(){show("Settings");});
  on(byId("tChat"),"click",function(){show("Chat");});

  function segInit(id){var g=byId(id);on(g,"click",function(e){var b=(e&&e.target)||(e&&e.srcElement)||window.event.srcElement;
    while(b&&b.parentNode!==g){b=b.parentNode;} if(!b)return;
    var c=g.childNodes,j;for(j=0;j<c.length;j++){if(c[j].className!==undefined)c[j].className="";}
    b.className="on";});}
  segInit("res");segInit("eng");
  function segVal(id){var c=byId(id).childNodes,j;for(j=0;j<c.length;j++){
    if(c[j].className==="on")return c[j].getAttribute("data-v");}return"";}

  var asg=byId("assign");on(asg,"click",function(){asg.className=(asg.className==="toggle on")?"toggle":"toggle on";});
  var slt=byId("slate");on(slt,"click",function(){slt.className=(slt.className==="toggle on")?"toggle":"toggle on";});

  var _payload="",_n=0;
  window.mfGetPayload=function(){return _payload;};
  function cmd(name,obj){_payload=obj?JSON.stringify(obj):"";_n++;document.title="MATFORGE::"+name+"::"+_n;}

  window.mfStatus=function(state,text){byId("dot").className="dot"+(state?" "+state:"");
    txt(byId("stxt"),text);byId("go").disabled=(state==="busy");};
  window.mfImage=function(p){byId("img").value=p||"";};
  window.mfSaveStatus=function(state,text){byId("sdot").className="dot"+(state?" "+state:"");txt(byId("sstxt"),text);};
  window.mfKeys=function(js){try{var k=JSON.parse(js);
    byId("falKey").setAttribute("placeholder",k.fal||"not set");
    byId("omKey").setAttribute("placeholder",k.omega||"not set");
    if(!byId("omModel").value){byId("omModel").value=k.omega_model||"";}}catch(e){}};
  window.mfChat=function(role,text){addMsg(role,text);};
  window.mfChatBusy=function(b){byId("send").disabled=!!b;byId("q").disabled=!!b;};

  on(byId("browse"),"click",function(){cmd("browse");});
  on(byId("go"),"click",function(){
    var p={img:byId("img").value,name:byId("name").value,cls:sel.value,
      res:segVal("res"),eng:segVal("eng"),assign:(asg.className==="toggle on"),
      slate:(slt.className==="toggle on")};
    if(!p.img){window.mfStatus("err","Pick a reference image first.");return;}
    window.mfStatus("busy","Generating "+p.res.toUpperCase()+" maps ("+p.eng+")...");
    cmd("create",p);});

  on(byId("saveKeys"),"click",function(){
    var p={fal:byId("falKey").value,omega:byId("omKey").value,model:byId("omModel").value};
    window.mfSaveStatus("busy","Saving...");cmd("savekeys",p);});

  function addMsg(role,text){var f=byId("feed"),m=document.createElement("div"),
    who=document.createElement("div"),t=document.createElement("div");
    m.className="msg "+(role==="user"?"u":"a");
    who.className="who";who.appendChild(document.createTextNode(role==="user"?"YOU":"FABLE-5"));
    t.className="txt";t.appendChild(document.createTextNode(text||""));
    m.appendChild(who);m.appendChild(t);f.appendChild(m);f.scrollTop=f.scrollHeight;}
  function ask(){var q=byId("q"),s=q.value.replace(/^\s+|\s+$/g,"");if(!s)return;
    addMsg("user",s);q.value="";window.mfChatBusy(true);cmd("chat",{q:s});}
  on(byId("send"),"click",ask);
  on(byId("q"),"keydown",function(e){var kc=(e&&e.keyCode)||(window.event&&window.event.keyCode);if(kc===13){ask();}});
})();
</script>
</body>
</html>
