name: inspector-tests
on:
  push:
    paths: ['inspector/**', '.github/workflows/inspector-tests.yml']
  pull_request:
    paths: ['inspector/**']
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]        # 3ds Max 2025–2026 ship 3.11; newer Max may move on
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install numpy pillow pytest PySide6
        working-directory: inspector
      - run: python -m pytest -q
        working-directory: inspector
      - run: python tools/build_bundle.py
        working-directory: inspector
# 3ds Max itself can't run on hosted runners: tools/max_selftest.py and tools/batch_scan.py
# run on the self-hosted Windows test PC (see docs/FIRST_WINDOWS_SESSION.md).
